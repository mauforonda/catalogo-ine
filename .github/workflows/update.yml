name: Update
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@master
        with:
          ref: master
      - name: python setup
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: python install
        run: |
          python -m pip install --upgrade pip
          pip install -r update/requirements.txt
      - name: update data
        run: |
          python update/AsyncUpdaterRetriesWorkers.py
      - name: commit
        run: |
          git config --global user.email "documentos-ine@example.com"
          git config --global user.name "documentos-ine-bot"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "[skip ci] update"; git push -q "https://$GH_TOKEN@github.com/mauforonda/documentos-ine.git" master)
