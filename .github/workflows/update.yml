name: Update catalogue

on:
  schedule:
    # 06:00 in Bolivia (UTC-4)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build catalogue
        run: python update.py

      - name: Commit updated catalogue
        run: |
          if git diff --quiet -- catalogo.csv; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.csv
          git commit -m "chore: update catalogue"
          git push
